name: skill version guard

# Each release channel owns one workflow baseline in release/channels.json. The release script
# synchronizes it into the bundled Skill VERSION; this guard rejects drift and unversioned edits.

on:
  push:
    branches: [main, preview]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: resolve and validate release channel
        id: channel
        env:
          RELEASE_BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        run: |
          case "$RELEASE_BRANCH" in
            main) CHANNEL="production" ;;
            preview) CHANNEL="preview" ;;
            *) echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          echo "name=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "plugin_root=$(node -e 'const c=require("./release/channels.json"); process.stdout.write(c[process.argv[1]].pluginRoot)' "$CHANNEL")" >> "$GITHUB_OUTPUT"
          PIREEL_RELEASE_BRANCH="$RELEASE_BRANCH" node scripts/release-channel.mjs "$CHANNEL" --check
      - name: skill changes must bump the version
        if: steps.channel.outputs.skip != '1'
        env:
          CHANNEL: ${{ steps.channel.outputs.name }}
          PLUGIN_ROOT: ${{ steps.channel.outputs.plugin_root }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # New branch or force-push sentinel: nothing to compare against.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "No comparable base commit; skipping."
            exit 0
          fi
          SKILL_DIR="$PLUGIN_ROOT/skills"
          VERSION_FILE="$SKILL_DIR/pireel/VERSION"
          # The tag is opaque (clients update on mismatch, not ordering) — the only shape
          # requirement is one clean token; the real invariant is that it CHANGES per release.
          if [ "$(wc -l < "$VERSION_FILE")" -gt 1 ] || ! grep -qE '^[^[:space:]]{1,64}$' "$VERSION_FILE"; then
            echo "::error::$VERSION_FILE must be a single non-empty token line."
            exit 1
          fi
          if git diff --quiet "$BASE" HEAD -- "$SKILL_DIR/"; then
            echo "Skill tree unchanged; ok."
            exit 0
          fi
          if ! git diff --quiet "$BASE" HEAD -- "$VERSION_FILE" && \
             ! git diff --quiet "$BASE" HEAD -- release/channels.json; then
            echo "Skill tree changed and $CHANNEL release baseline changed; ok."
            exit 0
          fi
          echo "::error::$SKILL_DIR/ changed without a synchronized $CHANNEL workflow release."
          echo "Run scripts/release-channel.mjs for this channel with a new workflow version."
          exit 1
