name: skill version guard
# Each release channel owns ONE version in release/channels.json. The release script writes it into
# the Plugin manifest and the bundled Skill VERSION, and records a content digest of the skill tree.
# This guard rejects drift (skills edited without a release) and manifests that disagree.
on:
  push:
    branches: [main, preview]
  pull_request:
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: resolve and validate release channel
        id: channel
        env:
          RELEASE_BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        run: |
          case "$RELEASE_BRANCH" in
            main) CHANNEL="production" ;;
            preview) CHANNEL="preview" ;;
            *) echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          echo "name=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "plugin_root=$(node -e 'const c=require("./release/channels.json"); process.stdout.write(c[process.argv[1]].pluginRoot)' "$CHANNEL")" >> "$GITHUB_OUTPUT"
          # --check recomputes the skill digest, so any skill edit that skipped a release fails here,
          # and it verifies plugin.json / VERSION / marketplace / MCP endpoint all match the channel.
          PIREEL_RELEASE_BRANCH="$RELEASE_BRANCH" node scripts/release-channel.mjs "$CHANNEL" --check
      - name: skill changes must ship as a new version
        if: steps.channel.outputs.skip != '1'
        env:
          CHANNEL: ${{ steps.channel.outputs.name }}
          PLUGIN_ROOT: ${{ steps.channel.outputs.plugin_root }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # New branch or force-push sentinel: nothing to compare against.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "No comparable base commit; skipping."
            exit 0
          fi
          SKILL_DIR="$PLUGIN_ROOT/skills"
          VERSION_FILE="$SKILL_DIR/pireel/VERSION"
          if git diff --quiet "$BASE" HEAD -- "$SKILL_DIR/" ":(exclude)$VERSION_FILE"; then
            echo "Skill tree unchanged; ok."
            exit 0
          fi
          # Skill content changed: the channel version must move, or Plugin users are told to update
          # to a version that does not exist.
          # Base may predate the single-version manifest (pluginVersion); never write undefined to stdout.
          BASE_VERSION="$(git show "$BASE:release/channels.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const c=JSON.parse(s)[process.argv[1]]||{};process.stdout.write(String(c.version??c.pluginVersion??""))})' "$CHANNEL")"
          HEAD_VERSION="$(node -e 'const c=require("./release/channels.json"); process.stdout.write(c[process.argv[1]].version)' "$CHANNEL")"
          if [ "$BASE_VERSION" != "$HEAD_VERSION" ]; then
            echo "Skill tree changed and $CHANNEL version moved $BASE_VERSION -> $HEAD_VERSION; ok."
            exit 0
          fi
          echo "::error::$SKILL_DIR/ changed but $CHANNEL version is still $HEAD_VERSION."
          echo "Run: node scripts/release-channel.mjs $CHANNEL --version <next>"
          exit 1
