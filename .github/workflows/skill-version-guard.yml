name: skill version guard

# The pireel skill self-updates through a version handshake: the MCP server
# announces a baseline and clients compare it against the VERSION file that
# ships next to SKILL.md. If skill content changes without a version bump,
# installed clients silently keep the stale copy. This guard fails any push
# or PR that edits the skill tree without touching VERSION (or leaves it in
# a shape clients can't compare).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: skill changes must bump the version
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # New branch or force-push sentinel: nothing to compare against.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "No comparable base commit; skipping."
            exit 0
          fi
          VERSION_FILE="pireel/skills/pireel/VERSION"
          # The tag is opaque (clients update on mismatch, not ordering) — the only shape
          # requirement is one clean token; the real invariant is that it CHANGES per release.
          if [ "$(wc -l < "$VERSION_FILE")" -gt 1 ] || ! grep -qE '^[^[:space:]]{1,64}$' "$VERSION_FILE"; then
            echo "::error::$VERSION_FILE must be a single non-empty token line."
            exit 1
          fi
          if git diff --quiet "$BASE" HEAD -- pireel/skills/; then
            echo "Skill tree unchanged; ok."
            exit 0
          fi
          if ! git diff --quiet "$BASE" HEAD -- "$VERSION_FILE"; then
            echo "Skill tree changed and VERSION changed; ok."
            exit 0
          fi
          echo "::error::pireel/skills/ changed but $VERSION_FILE did not."
          echo "Give it a new distinct value — the server baseline derives from the same file."
          exit 1
