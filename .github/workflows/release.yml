name: release a channel
# Builds a channel from a source and opens a pull request against its published branch.
# `main` and `preview` are never written directly: the PR's diff IS what ships.
#
# `source` may be the source branch (develop) or another channel's branch (preview). Promoting
# from a channel does NOT rebuild from that branch's files — those already carry that channel's
# identity. It resolves release/built-from.json and rebuilds from the exact source commit that
# channel was built from, so production ships the content preview actually validated.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to release
        required: true
        type: choice
        options: [preview, production]
      source:
        description: Source to build from — develop, or a channel branch to promote (preview)
        required: true
        default: develop
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: resolve the source commit
        id: src
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          # If SOURCE is a published channel branch, promote what it was built from.
          IS_CHANNEL=$(node -e '
            const c = require("./release/channels.json").channels;
            process.stdout.write(Object.values(c).some((v) => v.branch === process.argv[1]) ? "yes" : "no");
          ' "$SOURCE")
          if [ "$IS_CHANNEL" = "yes" ]; then
            SHA=$(git show "origin/$SOURCE:release/built-from.json" 2>/dev/null \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(String(JSON.parse(s||"{}").sha||"")))')
            if [ -z "$SHA" ]; then
              echo "::error::$SOURCE has no release/built-from.json; cannot promote it. Release it with this workflow first, or build from develop."
              exit 1
            fi
            REF_NAME=$(git show "origin/$SOURCE:release/built-from.json" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(String(JSON.parse(s||"{}").source||"unknown")))')
            echo "::notice::Promoting $SOURCE — rebuilding from $REF_NAME@$SHA, the commit it was built from."
          else
            SHA=$(git rev-parse "origin/$SOURCE")
            REF_NAME="$SOURCE"
          fi
          git cat-file -e "$SHA^{commit}" || { echo "::error::$SHA is not a commit in this repository"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "ref=$REF_NAME" >> "$GITHUB_OUTPUT"

      - name: build the channel
        id: build
        env:
          CHANNEL: ${{ inputs.channel }}
          SHA: ${{ steps.src.outputs.sha }}
          REF_NAME: ${{ steps.src.outputs.ref }}
        run: |
          TARGET=$(node -e 'process.stdout.write(require("./release/channels.json").channels[process.argv[1]].branch)' "$CHANNEL")
          git checkout -B "release/$CHANNEL" "origin/$TARGET"
          # Take the authored content from the source commit, then build this channel from it.
          git checkout "$SHA" -- package.json release plugins scripts README.md RELEASING.md .github
          rm -f release/built-from.json
          node scripts/build-channel.mjs "$CHANNEL" --source "$REF_NAME" --sha "$SHA"
          node scripts/build-channel.mjs "$CHANNEL" --check
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "version=$(node -e 'process.stdout.write(require("./package.json").version)')" >> "$GITHUB_OUTPUT"

      - name: open the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          TARGET: ${{ steps.build.outputs.target }}
          VERSION: ${{ steps.build.outputs.version }}
          REF_NAME: ${{ steps.src.outputs.ref }}
          SHA: ${{ steps.src.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --quiet --cached; then
            echo "::notice::$TARGET is already the $CHANNEL build of $REF_NAME@$SHA at $VERSION; nothing to release."
            exit 0
          fi
          git commit -m "release: $CHANNEL $VERSION from $REF_NAME@$SHA"
          git push -f origin "release/$CHANNEL"
          BODY=$(printf '%s\n' \
            "Built by \`scripts/build-channel.mjs $CHANNEL\` from \`$REF_NAME\` at \`$SHA\`." \
            "" \
            "The diff is exactly what publishes to the **$CHANNEL** channel; merging is the release." \
            "Nothing in it is hand-written — to change it, change the source branch and re-run this workflow." \
            "The version comes from \`package.json\` on the source branch: **$VERSION**.")
          gh pr create --base "$TARGET" --head "release/$CHANNEL" \
            --title "release: $CHANNEL $VERSION" --body "$BODY" \
            || gh pr edit "release/$CHANNEL" --title "release: $CHANNEL $VERSION" --body "$BODY"
