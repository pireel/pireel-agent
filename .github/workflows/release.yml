name: release production
# Builds the production plugin from a source and opens a pull request against `main`.
# `main` is never written directly: the PR's diff IS what ships. The preview plugin is
# never published — testers build it locally with `pnpm pack:preview`.
on:
  workflow_dispatch:
    inputs:
      source:
        description: Source branch or commit to build from
        required: true
        default: develop
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: resolve the source commit
        id: src
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          # Resolve an authored branch or commit directly; published builds are not source.
          SHA=$(git rev-parse --verify --end-of-options "refs/remotes/origin/$SOURCE^{commit}" 2>/dev/null \
            || git rev-parse --verify --end-of-options "$SOURCE^{commit}")
          if git cat-file -e "$SHA:release/built-from.json" 2>/dev/null; then
            echo "::error::Build from an authored source branch or commit (normally develop), not a published build."
            exit 1
          fi
          REF_NAME="$SOURCE"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "ref=$REF_NAME" >> "$GITHUB_OUTPUT"

      - name: build production
        id: build
        env:
          SHA: ${{ steps.src.outputs.sha }}
          REF_NAME: ${{ steps.src.outputs.ref }}
        run: |
          git checkout -B release/production origin/main
          # Take the authored content from the source commit, then build production from it.
          # Clear each path first: `git checkout <sha> -- <path>` overwrites but never deletes, so a
          # file the source branch removed (a retired script or workflow) would survive on the
          # published branch and run against a manifest it no longer understands.
          # Include the retired maintainer guide so it disappears from main on release.
          rm -rf package.json release plugins scripts README.md RELEASING.md .github
          git checkout "$SHA" -- package.json release plugins scripts README.md .github
          rm -f release/built-from.json
          node scripts/build-channel.mjs production --source "$REF_NAME" --sha "$SHA"
          node scripts/build-channel.mjs production --check
          echo "version=$(node -e 'process.stdout.write(require("./package.json").version)')" >> "$GITHUB_OUTPUT"

      - name: open the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
          REF_NAME: ${{ steps.src.outputs.ref }}
          SHA: ${{ steps.src.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --quiet --cached; then
            echo "::notice::main is already the production build of $REF_NAME@$SHA at $VERSION; nothing to release."
            exit 0
          fi
          git commit -m "release: production $VERSION from $REF_NAME@$SHA"
          git push -f origin "release/production"
          BODY_FILE=$(mktemp)
          cat > "$BODY_FILE" <<EOF
          Built by \`scripts/build-channel.mjs production\` from \`$REF_NAME\` at \`$SHA\`.

          This diff is the production build; merging publishes it to users.
          To change it, edit the source and re-run this workflow.
          The version comes from \`package.json\` on the source branch: **$VERSION**.
          EOF
          gh pr create --base "main" --head "release/production" \
            --title "release: production $VERSION" --body-file "$BODY_FILE" \
            || gh pr edit "release/production" --title "release: production $VERSION" --body-file "$BODY_FILE"
