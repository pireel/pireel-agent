name: channel guard
# main and preview are published branches: each must be exactly the build output of its channel.
# Nothing there is hand-maintained, so this re-runs the build and rejects any difference.
on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main, preview]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: resolve channel from the target branch
        id: channel
        env:
          TARGET: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        run: |
          CHANNEL=$(node -e '
            const c = require("./release/channels.json").channels;
            const hit = Object.entries(c).find(([, v]) => v.branch === process.argv[1]);
            if (!hit) { console.error(`no channel publishes branch ${process.argv[1]}`); process.exit(1); }
            process.stdout.write(hit[0]);
          ' "$TARGET")
          echo "name=$CHANNEL" >> "$GITHUB_OUTPUT"
      - name: this branch must be the build output of its channel
        run: node scripts/build-channel.mjs "${{ steps.channel.outputs.name }}" --check

      - name: shipped content that changed must ship as a new version
        run: |
          # A host installs by version: publishing changed skills under the version users already
          # have means they never receive them. Compare against what this branch publishes today.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No comparable base commit; skipping."
            exit 0
          fi
          if git diff --quiet "$BASE" HEAD -- plugins ':(exclude)plugins/*/skills/pireel/VERSION'; then
            echo "Published plugin content unchanged; ok."
            exit 0
          fi
          BASE_VERSION=$(git show "$BASE:package.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(String(JSON.parse(s||"{}").version||"")))')
          HEAD_VERSION=$(node -e 'process.stdout.write(require("./package.json").version)')
          if [ "$BASE_VERSION" != "$HEAD_VERSION" ]; then
            echo "Content changed and the version moved $BASE_VERSION -> $HEAD_VERSION; ok."
            exit 0
          fi
          echo "::error::The published plugin changed but the version is still $HEAD_VERSION, so no host will install it."
          echo "Bump \"version\" in package.json on the source branch and re-run the release workflow."
          exit 1
      - name: the skills must name only this channel's environment
        env:
          CHANNEL: ${{ steps.channel.outputs.name }}
        run: |
          # Identity files are generated, so build --check already proves them. What can still go
          # wrong is the agent-facing prose: a skill that names the other environment is exactly how
          # an agent ends up logging into, registering, or editing the wrong place.
          node - <<'NODE'
          const { readdirSync, readFileSync, statSync } = require('node:fs');
          const { join } = require('node:path');
          const channels = require('./release/channels.json').channels;
          const channel = process.env.CHANNEL;
          const esc = (s) => String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

          // Scan only for identifiers the agent ACTS on. The product's display name runs through
          // ordinary prose in both channels ("Pireel Studio is a multi-source editor"), so matching
          // it flags every sentence; what must never cross a channel is a name the reader logs
          // into, registers or calls. `(?![\w-])` keeps `pireel` out of `pireel-preview`.
          const patterns = (c) => [
            [String.raw`\`${esc(c.mcpServer)}\` MCP server`, 'names it as the server to call'],
            [String.raw`mcp login ${esc(c.mcpServer)}(?![\w-])`, 'logs in there'],
            [String.raw`\[mcp_servers\.${esc(c.mcpServer)}\]`, 'registers it'],
            [String.raw`--transport http ${esc(c.mcpServer)}(?![\w-])`, 'registers it'],
            [String.raw`${esc(c.baseUrl)}/api/studio/mcp`, 'points at its endpoint'],
            [String.raw`${esc(c.marketplace)}(?![\w-])`, 'names its marketplace'],
          ];

          const files = [];
          const walk = (dir) => {
            for (const e of readdirSync(dir)) {
              const full = join(dir, e);
              if (statSync(full).isDirectory()) walk(full);
              else if (/\.(md|mjs|js|json|txt)$/.test(e)) files.push(full);
            }
          };
          for (const plugin of readdirSync('plugins')) {
            const skills = join('plugins', plugin, 'skills');
            try { if (statSync(skills).isDirectory()) walk(skills); } catch {}
          }

          let bad = false;
          for (const [name, other] of Object.entries(channels)) {
            if (name === channel) continue;
            for (const [source, what] of patterns(other)) {
              const re = new RegExp(source, 'g');
              for (const file of files) {
                for (const line of readFileSync(file, 'utf8').split('\n')) {
                  re.lastIndex = 0;
                  if (!re.test(line)) continue;
                  console.error(`::error file=${file}::${channel} skills reach the ${name} environment — this ${what}: ${line.trim()}`);
                  bad = true;
                }
              }
            }
          }
          if (bad) {
            console.error('Rewrite it in the PROSE rules of scripts/build-channel.mjs; never hand-patch a published branch.');
            process.exit(1);
          }
          console.log(`skills name only the ${channel} environment (${files.length} files scanned)`);
          NODE
